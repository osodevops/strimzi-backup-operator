# Default values for strimzi-backup-operator

# Number of replicas. More than one only makes sense with leaderElection
# enabled: the extra replicas are warm standbys that take over the lease when
# the leader stops.
replicaCount: 1

# Deployment update strategy. The default never schedules two operator pods
# at once (maxSurge 0 / maxUnavailable 1): the outgoing pod is deleted before
# its replacement is created, and while it drains the leader lease keeps it the
# only writer (issue #62). `type: Recreate` additionally waits for the old pod
# to be fully gone, but an existing release managed with server-side apply
# (Helm 4) cannot switch to it in place: the API-defaulted rollingUpdate block
# is forbidden with Recreate. Use Recreate on fresh installs, or first run
# `kubectl patch deploy <release> --type=json -p '[{"op":"remove","path":"/spec/strategy/rollingUpdate"}]'`.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/osodevops/strimzi-backup-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  # For Azure Workload Identity, add:
  #   azure.workload.identity/client-id: "<managed-identity-client-id>"
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

backupJobs:
  # Default service account used by backup and restore job pods.
  # If empty, the chart passes the operator service account name.
  # The account must exist in each namespace where KafkaBackup/KafkaRestore
  # resources are created; individual resources can override it with
  # spec.template.pod.serviceAccountName.
  serviceAccountName: ""

# Azure Workload Identity configuration
# When enabled, the operator can authenticate to Azure services using federated identity tokens
# instead of storing credentials in Kubernetes secrets
azureWorkloadIdentity:
  # Enable Azure Workload Identity support
  enabled: false
  # The client ID of the Azure Managed Identity
  # This should match the identity federated with this service account
  clientId: ""

# Namespaces to watch (empty = all namespaces)
watchNamespaces: []

# Logging configuration
logging:
  level: "info,kafka_backup_operator=debug"
  format: json

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Metrics service configuration
service:
  type: ClusterIP
  port: 9090
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/os: linux

tolerations: []

affinity: {}

# Metrics configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # Scrape kafka-backup job pods directly. This is separate from the
  # ServiceMonitor above, which only scrapes the operator on port 9090.
  jobPodMonitor:
    enabled: false
    namespace: ""
    namespaceSelector:
      any: true
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    labels: {}

# CRD installation
crds:
  # Install CRDs with the chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true

# Leader election. Only the replica holding the Lease
# `<release fullname>-leader` (coordination.k8s.io, in the operator namespace)
# runs the controllers; the others stand by and report `standby` on /readyz.
# Keeps a draining pod from racing its successor on node drain / eviction /
# preemption, where Recreate cannot help. Requires the leases RBAC rule the
# chart renders when enabled; set to false to opt out.
leaderElection:
  enabled: true
  leaseDuration: 15s   # how long a standby waits without seeing a change before taking over
  renewDeadline: 10s   # how long the leader keeps retrying renewals before it exits (and restarts)
  retryPeriod: 2s      # interval between acquire/renew attempts; must be < renewDeadline < leaseDuration
